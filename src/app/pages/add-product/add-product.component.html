<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">{{ isEdit ? 'Edit Product' : 'Add Product' }}</h3>


  <!-- Back / Cancel Button -->
  <button class="btn btn-secondary" type="button" (click)="goBack()">
    ← Back
  </button>
</div>

<form [formGroup]="productForm" (ngSubmit)="saveProduct()">

  <div class="row">

    <div class="col-md-6 mb-3">
      <label>Product Name</label>
      <input class="form-control" formControlName="product_name">
    </div>

    <div class="col-md-6 mb-3">
      <label>Purchase Price</label>
      <input type="number" class="form-control" formControlName="purchase_price">
    </div>

    <div class="col-md-12 mb-3">
      <label>Description</label>
      <textarea class="form-control" formControlName="product_decription"></textarea>
    </div>

    <div class="col-md-6 mb-3">
      <label>Selling Price</label>
      <input type="number" class="form-control" formControlName="product_selling_price">
    </div>

    <div class="col-md-6 mb-3">
      <label>Stock Quantity</label>
      <input type="number" class="form-control" formControlName="product_stock_quantity">
    </div>

    <div class="col-md-6 mb-3">
      <label>Status</label>
      <select class="form-control" formControlName="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>

  </div>

 <button class="btn btn-success">
  {{ isEdit ? 'Update Product' : 'Save Product' }}
</button>


</form>
