<div class="container-fluid">
    <!-- HEADER / NAV -->
    <nav class="navbar navbar-expand-lg navbar-light py-3 mb-4">
        <div class="container-fluid">
            <!-- <a class="navbar-brand text-white fw-bold fs-4">Medical Inventory</a> -->

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <button class="btn btn-light fw-semibold me-0" data-bs-toggle="modal" data-bs-target="#addModal">
                        + Add Product
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- DASHBOARD CARDS -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h6 class="fw-semibold text-secondary">Total Products</h6>
                <h3 class="fw-bold text-primary">128</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h6 class="fw-semibold text-secondary">Low Stock</h6>
                <h3 class="fw-bold text-danger">16</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h6 class="fw-semibold text-secondary">Out of Stock</h6>
                <h3 class="fw-bold text-dark">4</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h6 class="fw-semibold text-secondary">Active Products</h6>
                <h3 class="fw-bold text-success">112</h3>
            </div>
        </div>
    </div>

    <!-- PRODUCT TABLE -->
    <div class="card shadow-sm mb-5">
        <div class="card-header bg-white py-3 d-flex justify-content-between">
            <h5 class="fw-bold text-primary mb-0">Manage Medical Products</h5>

            <input type="search" class="form-control w-25" placeholder="Search product...">
        </div>

        <div class="table-responsive p-3">
            <table class="table table-bordered table-hover w-100">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Product Name</th>
                        <th>Purchase Price</th>
                        <th>Selling Price</th>
                        <th>Stock Qty</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Omni Tablet</td>
                        <td>₹75</td>
                        <td>₹100</td>
                        <td>30</td>
                        <td><span class="badge bg-success">Active</span></td>
                        <td>Used for fever</td>
                        <td>
                            <button class="btn btn-sm btn-warning" data-bs-toggle="modal"
                                data-bs-target="#updateModal">Edit</button>
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

    <!-- </div> -->

    <!-- ADD PRODUCT MODAL -->
    <div class="modal fade" id="addModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Add New Product</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="fw-semibold">Product Name</label>
                                <input type="text" class="form-control" placeholder="Enter product name">
                            </div>

                            <div class="col-md-6">
                                <label class="fw-semibold">Purchase Price</label>
                                <input type="number" class="form-control" placeholder="Enter price">
                            </div>

                            <div class="col-md-6">
                                <label class="fw-semibold">Selling Price</label>
                                <input type="number" class="form-control" placeholder="Enter selling price">
                            </div>

                            <div class="col-md-6">
                                <label class="fw-semibold">Stock Quantity</label>
                                <input type="number" class="form-control" placeholder="Enter stock">
                            </div>

                            <div class="col-md-6">
                                <label class="fw-semibold">Status</label>
                                <select class="form-select">
                                    <option value="1">Active</option>
                                    <option value="0">Inactive</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="fw-semibold">Description</label>
                                <textarea class="form-control" rows="3" placeholder="Enter description"></textarea>
                            </div>

                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary">Save</button>
                </div>

            </div>
        </div>
    </div>
</div>
