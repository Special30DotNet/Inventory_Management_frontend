<!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->
<button command="show-modal" commandfor="dialog" style="cursor: pointer;"
    class="px-5 py-2 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 text-sm font-semibold shadow">Add product</button>
<el-dialog>
    <dialog id="dialog" aria-labelledby="dialog-title"
        class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop
            class="fixed inset-0 bg-gray-500/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>

        <div tabindex="0"
            class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
            <el-dialog-panel
                class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">

<!-- add product form start here -->
<div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
  <h3 id="dialog-title" class="text-base font-semibold text-gray-900">
    Add product details
  </h3>

  <form [formGroup]="addProductForm">
    <div class="space-y-12">
      <div class="border-b border-gray-900/10 pb-12">
        <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

          <!-- Product name -->
          <div class="sm:col-span-3">
            <label for="product-name" class="block text-sm/6 font-medium text-gray-900">Product name</label>
            <div class="mt-2">
              <input id="product-name" type="text" name="product_name" formControlName="product_name"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Description -->
          <div class="sm:col-span-3">
            <label for="description" class="block text-sm/6 font-medium text-gray-900">Description</label>
            <div class="mt-2">
              <input id="description" type="text" name="product_decription" formControlName="product_decription"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Purchase price -->
          <div class="sm:col-span-3">
            <label for="purchase-price" class="block text-sm/6 font-medium text-gray-900">Purchase price</label>
            <div class="mt-2">
              <input id="purchase-price" type="text" name="purchasePrice" formControlName="purchasePrice"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Selling price -->
          <div class="sm:col-span-3">
            <label for="sellingPrice" class="block text-sm/6 font-medium text-gray-900">Selling price</label>
            <div class="mt-2">
              <input id="sellingPrice" type="text" name="sellingPrice" formControlName="sellingPrice"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Quantity -->
          <div class="sm:col-span-3">
            <label for="quantityId" class="block text-sm/6 font-medium text-gray-900">Quantity</label>
            <div class="mt-2">
              <input id="quantityId" type="text" name="quantity" formControlName="quantity"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Image URL -->
          <div class="sm:col-span-3">
            <label for="imageUrlId" class="block text-sm/6 font-medium text-gray-900">Image Url</label>
            <div class="mt-2">
              <input id="imageUrlId" type="text" name="image_url" formControlName="image_url"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Status -->
          <div class="sm:col-span-3">
            <label for="statusId" class="block text-sm/6 font-medium text-gray-900">Status</label>
            <div class="mt-2">
              <select id="statusId" name="status" formControlName="status"
                class="block w-full rounded-md bg-white px-3 py-2.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6">
                <option>In stock</option>
                <option>Out of stock</option>
              </select>
            </div>
          </div>

          <!-- Created Date -->
          <div class="sm:col-span-3">
            <label class="block text-sm/6 font-medium text-gray-900">Created date</label>
            <div class="mt-2">
              <input type="date" name="createdDate" formControlName="createdDate"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Created By -->
          <div class="sm:col-span-3">
            <label class="block text-sm/6 font-medium text-gray-900">Created by</label>
            <div class="mt-2">
              <select name="created_by" formControlName="created_by"
                class="w-full rounded-md bg-white py-2.5 px-3 text-base text-gray-900 outline-1 outline-gray-300 focus:outline-indigo-600 sm:text-sm/6">
                <option>Admin</option>
                <option>Store Manager</option>
              </select>
            </div>
          </div>

          <!-- Modify Date -->
          <div class="sm:col-span-3">
            <label class="block text-sm/6 font-medium text-gray-900">Modify date</label>
            <div class="mt-2">
              <input type="date" name="modifyDate" formControlName="modifyDate"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 outline-gray-300 placeholder:text-gray-400 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
          </div>

          <!-- Modified By -->
          <div class="sm:col-span-3">
            <label class="block text-sm/6 font-medium text-gray-900">Modified by</label>
            <div class="mt-2">
              <select name="modified_by" formControlName="modified_by"
                class="w-full rounded-md bg-white py-2.5 px-3 text-base text-gray-900 outline-1 outline-gray-300 focus:outline-indigo-600 sm:text-sm/6">
                <option>Admin</option>
                <option>Store Manager</option>
              </select>
            </div>
          </div>

        </div> <!-- grid end -->
      </div> <!-- border section end -->
    </div> <!-- space-y end -->
  </form>
</div>
</div>
</div>
<!-- add product form end here -->
<div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
  <button type="button" command="close" commandfor="dialog" class="inline-flex w-full justify-center rounded-md bg-gray-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-gray-500 sm:ml-3 sm:w-auto"
    (click)="onSaveClick()">Save</button>
  <button type="button" command="close" commandfor="dialog" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Cancel</button>
</div>
</el-dialog-panel>
</div>
</dialog>
</el-dialog>

<!-- Toast Notification code -->
@if (isShowNotification()) {
<div class="fixed bottom-6 right-6 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3">
  <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
  </svg>
  <span>Product saved successfully!</span>
    <button class="text-gray-500 hover:text-gray-700" (click)="closeNotification()">
    ✕
  </button>
</div>
}
